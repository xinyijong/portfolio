<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="nav">
        <div class="wrap">
            <a href="index.html" class="logo">JXY<svg class="logo-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0Q12.7 11.3 24 12Q12.7 12.7 12 24Q11.3 12.7 0 12Q11.3 11.3 12 0Z" /></svg></a>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="gallery.html" class="current">Gallery</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="gallery-hero wrap">
            <a href="index.html#about" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>Back to about</a>
            <h1>Photo<span style="color:var(--gold)">graphy</span></h1>
        </section>

        <div class="wrap reveal">
            <div class="carousel" id="carousel">
                <div class="ring" id="ring"></div>
            </div>
            <div class="car-ui">
                <button class="car-btn" id="cPrev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg></button>
                <span class="car-count" id="cCount"></span>
                <button class="car-btn" id="cNext" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg></button>
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="x" aria-label="Close">&times;</button>
        <button class="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg></button>
        <img alt="">
        <button class="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg></button>
        <div class="count"></div>
    </div>

    <footer>&copy; 2026 Jong Xin Yi</footer>

    <script src="photos.js"></script>
    <script>
        const ring = document.getElementById("ring"), stage = document.getElementById("carousel");
        const countEl = document.getElementById("cCount");
        const n = PHOTOS.length, step = 360 / n;
        const mod = (a, b) => ((a % b) + b) % b;

        ring.innerHTML = PHOTOS.map((p, i) => `
        <div class="cell" data-i="${i}" tabindex="0" role="button" aria-label="${p.alt}">
        <img alt="${p.alt}" draggable="false">
        <span class="ph">Add photo</span>
        <label class="upload"><b>Upload</b><input type="file" accept="image/*" hidden></label>
        </div>`).join("");
        const cells = [...ring.children];

        // Downscale big photos so they fit in browser storage
        const shrink = (file, max = 1600) => new Promise(res => {
        const url = URL.createObjectURL(file), im = new Image();
        im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .85));
        };
        im.src = url;
        });

        cells.forEach((tile, i) => {
        const img = tile.querySelector("img"), input = tile.querySelector("input"), label = tile.querySelector(".upload b");
        img.addEventListener("load", () => { tile.classList.add("has-img"); label.textContent = "Change"; });
        img.addEventListener("error", () => tile.classList.remove("has-img"));
        let saved = null;
        try { saved = localStorage.getItem("photo-" + i); } catch (e) {}
        img.src = saved || PHOTOS[i].src;

        tile.querySelector(".upload").addEventListener("click", e => e.stopPropagation());
        input.addEventListener("change", async () => {
        const f = input.files[0]; if (!f) return;
        const data = await shrink(f);
        img.src = data;
        try { localStorage.setItem("photo-" + i, data); }
        catch (e) { alert("Browser storage is full, so this photo won't be kept after you close the page."); }
        });
        });

        /* ---------- Cover-flow carousel: centre photo large, neighbours angled behind it ---------- */
        let W = 330, cur = 0, pos = 0, dragging = false, sx = 0, spos = 0, moved = 0;

        function layout() { W = cells[0].offsetWidth; render(); }
        function render() {
        cells.forEach((c, i) => {
        const d = mod(i - pos + n / 2, n) - n / 2;      // signed distance from the centre photo
        const a = Math.abs(d), s = Math.sign(d);
        const x = s * (Math.min(a, 1) * W * 0.74 + Math.max(0, Math.min(a, 3) - 1) * W * 0.36);
        const ry = -s * Math.min(a, 1) * 38;            // angle the side photos towards the centre
        const sc = 1 - Math.min(a, 2) * 0.11;           // and make them a bit smaller
        const z = -Math.min(a, 2) * 90;
        c.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${ry}deg) scale(${sc})`;
        c.style.opacity = a <= 1 ? 1 - a * 0.1 : a <= 2 ? 0.9 - (a - 1) * 0.35 : Math.max(0, 0.55 - (a - 2) * 0.9);
        c.style.zIndex = Math.round(100 - a * 10);
        c.style.pointerEvents = a > 2.6 ? "none" : "";
        c.classList.toggle("front", a < 0.5);
        });
        countEl.textContent = `${mod(Math.round(pos), n) + 1} / ${n}`;
        }
        const go = d => { cur += d; pos = cur; render(); };
        const goTo = i => go(mod(i - mod(cur, n) + n / 2, n) - n / 2); // shortest way round

        stage.addEventListener("pointerdown", e => {
        if (e.target.closest(".upload")) return;
        dragging = true; sx = e.clientX; spos = pos; moved = 0;
        ring.classList.add("dragging"); stage.classList.add("dragging");
        });
        addEventListener("pointermove", e => {
        if (!dragging) return;
        const dx = e.clientX - sx;
        moved = Math.max(moved, Math.abs(dx));
        pos = spos - dx / (W * 0.55);                   // drag sensitivity
        render();
        });
        const endDrag = (e, canClick) => {
        if (!dragging) return;
        dragging = false;
        ring.classList.remove("dragging"); stage.classList.remove("dragging");
        if (moved > 6) { cur = Math.round(pos); pos = cur; render(); }
        else if (canClick) { const c = e.target.closest(".cell"); if (c) onCell(c); }
        };
        addEventListener("pointerup", e => endDrag(e, true));
        addEventListener("pointercancel", e => endDrag(e, false));

        document.getElementById("cPrev").onclick = () => go(-1);
        document.getElementById("cNext").onclick = () => go(1);
        addEventListener("resize", layout);

        /* ---------- lightbox ---------- */
        const lb = document.getElementById("lightbox");
        const lbImg = lb.querySelector("img"), count = lb.querySelector(".count");
        let list = [], idx = 0;
        const show = k => {
        idx = (k + list.length) % list.length;
        lbImg.src = list[idx].querySelector("img").src;
        count.textContent = `${idx + 1} / ${list.length}`;
        };
        const open = tile => {
        list = cells.filter(c => c.classList.contains("has-img"));
        show(list.indexOf(tile)); lb.classList.add("open"); lb.setAttribute("aria-hidden", "false");
        };
        const close = () => {
        lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true");
        if (list[idx]) goTo(cells.indexOf(list[idx])); // carousel follows the photo you were viewing
        };
        const activate = tile => {
        if (tile.classList.contains("has-img")) open(tile);
        else if (document.body.classList.contains("owner")) tile.querySelector("input").click();
        };
        const onCell = cell => {
        const i = cells.indexOf(cell);
        if (i === mod(cur, n)) activate(cell); else goTo(i);
        };

        ring.addEventListener("keydown", e => {
        const c = e.target.closest(".cell");
        if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onCell(c); }
        });
        lb.querySelector(".x").onclick = close;
        lb.querySelector(".prev").onclick = () => show(idx - 1);
        lb.querySelector(".next").onclick = () => show(idx + 1);
        lb.addEventListener("click", e => { if (e.target === lb) close(); });
        addEventListener("keydown", e => {
        if (lb.classList.contains("open")) {
        if (e.key === "Escape") close();
        if (e.key === "ArrowLeft") show(idx - 1);
        if (e.key === "ArrowRight") show(idx + 1);
        } else if (!e.target.matches("input")) {
        if (e.key === "ArrowLeft") go(-1);
        if (e.key === "ArrowRight") go(1);
        }
        });

        layout();
    </script>
    <script src="fx.js"></script>
</body>
</html>
